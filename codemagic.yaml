# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
# =============================================================================
# codemagic.yaml — Mi Día: Compilación iOS para iPhone físico
# =============================================================================
# - Compilación para dispositivos iOS físicos.
# - No utiliza certificados de firma de Apple.
# - Genera un IPA sin firma para posterior firma de desarrollo.
# - Compatible con máquinas Mac mini M2 de Codemagic.
# =============================================================================

workflows:
  ios-device-build:
    name: Mi Día - iOS Device Build (Prueba)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/org.swift.swiftpm

    # Las compilaciones serán exclusivamente manuales.

    scripts:
      - name: Verificar versiones del entorno
        script: |
          echo "=== Entorno de ejecución ==="
          echo "macOS: $(sw_vers -productVersion)"
          echo "Node.js: $(node --version)"
          echo "npm: v$(npm --version)"
          xcodebuild -version

      - name: Instalar dependencias npm
        script: |
          npm ci --prefer-offline

      - name: Compilar aplicación web (Angular / Ionic)
        script: |
          npm run build

      - name: Verificar plataforma iOS y sincronizar Capacitor
        script: |
          if [ ! -d "ios" ]; then
            echo "ERROR: No se encontró la carpeta ios/."
            exit 1
          fi

          SCHEME_PATH="ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme"

          if [ ! -f "$SCHEME_PATH" ]; then
            echo "ERROR: No se encontró el esquema Xcode."
            exit 1
          fi

          npx cap sync ios

      - name: Compilar app iOS para iPhone físico
        script: |
          DERIVED_DATA_DIR="$CM_BUILD_DIR/build"

          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA_DIR" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar IPA sin firma
        script: |
          PRODUCTS_DIR="$CM_BUILD_DIR/build/Build/Products/Debug-iphoneos"
          APP_PATH="$PRODUCTS_DIR/App.app"
          IPA_DIR="$CM_BUILD_DIR/ipa/Payload"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No se encontró App.app para iPhone."
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Falta Info.plist."
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP_PATH/Info.plist")

          if [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "ERROR: No se encontró el ejecutable de la aplicación."
            exit 1
          fi

          mkdir -p "$IPA_DIR"
          cp -R "$APP_PATH" "$IPA_DIR/"

          cd "$CM_BUILD_DIR/ipa"
          zip -r -X "MiDia-iPhone-unsigned.ipa" Payload

          echo "IPA sin firma generado correctamente."

    artifacts:
      - ipa/*.ipa

