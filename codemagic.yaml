# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
# =============================================================================
# codemagic.yaml — Mi Día: Compilación iOS para simulador
# =============================================================================
# - Compilación para Simulador iOS.
# - No requiere certificados de firma ni cuenta Apple Developer de pago.
# - Compatible con máquinas Mac mini M2 de Codemagic.
# - Genera un ZIP descargable con la aplicación compilada (.app).
# =============================================================================

workflows:
  ios-simulator-build:
    name: Mi Día - iOS Simulator Build (Prueba)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/org.swift.swiftpm

    # Las compilaciones serán exclusivamente manuales.
    # No se habilitan triggers automáticos.

    scripts:
      - name: Verificar versiones del entorno
        script: |
          echo "=== Entorno de ejecución ==="
          echo "macOS: $(sw_vers -productVersion)"
          echo "Node.js: $(node --version)"
          echo "npm: v$(npm --version)"
          xcodebuild -version

      - name: Instalar dependencias npm
        script: |
          npm ci --prefer-offline

      - name: Compilar aplicación web (Angular / Ionic)
        script: |
          npm run build

      - name: Verificar plataforma iOS y sincronizar Capacitor
        script: |
          if [ ! -d "ios" ]; then
            echo "ERROR: No se encontró la carpeta ios/."
            exit 1
          fi

          SCHEME_PATH="ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme"

          if [ ! -f "$SCHEME_PATH" ]; then
            echo "ERROR: No se encontró el esquema Xcode: $SCHEME_PATH"
            exit 1
          fi

          echo "Esquema Xcode verificado correctamente."
          echo "Sincronizando Capacitor con iOS..."

          npx cap sync ios

      - name: Compilar app iOS para simulador
        script: |
          DERIVED_DATA_DIR="$CM_BUILD_DIR/build"

          echo "Compilando proyecto nativo con Swift Package Manager..."

          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA_DIR" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar aplicación para simulador
        script: |
          PRODUCTS_DIR="$CM_BUILD_DIR/build/Build/Products/Debug-iphonesimulator"
          APP_PATH="$PRODUCTS_DIR/App.app"

          if [ -d "$APP_PATH" ]; then
            echo "Empaquetando App.app en ZIP..."

            cd "$PRODUCTS_DIR"
            zip -r -X "MiDia-iOS-Simulator.zip" "App.app"

            echo "ZIP generado correctamente."
          else
            echo "ERROR: No se encontró la aplicación compilada en $APP_PATH"
            exit 1
          fi

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.zip
      - build/Build/Products/Debug-iphonesimulator/*.app
